<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Event Registration Form</title>
    <!-- jQuery (official CDN) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f5f7fa 0%, #e9ecf0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 16px;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 35px rgba(0, 10, 30, 0.2), 0 5px 12px rgba(0,0,0,0.1);
            border-radius: 32px;
            width: 100%;
            max-width: 480px;
            padding: 30px 28px;
            border: 1px solid rgba(255,255,255,0.5);
        }
        h2 {
            font-weight: 600;
            color: #1a2639;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 2rem;
            letter-spacing: -0.5px;
            border-left: 7px solid #3a7ca5;
            padding-left: 18px;
        }
        .sub {
            color: #2c3e50;
            margin-bottom: 28px;
            margin-top: 5px;
            font-size: 0.95rem;
            padding-left: 25px;
            opacity: 0.8;
        }
        .form-group {
            margin-bottom: 22px;
            position: relative;
        }
        label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #1e2b3c;
            display: block;
            margin-bottom: 6px;
            margin-left: 4px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            background: white;
            border: 2px solid #dbe0e8;
            border-radius: 50px;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        input:focus {
            border-color: #3a7ca5;
            box-shadow: 0 0 0 4px rgba(58,124,165,0.2);
        }
        /* disabled / non-editable field style */
        input[readonly] {
            background-color: #f0f3f8;
            color: #2f3e4e;
            font-weight: 500;
            cursor: default;
            border-color: #cbd5e1;
        }
        .button-group {
            display: flex;
            gap: 14px;
            margin-top: 35px;
            flex-wrap: wrap;
        }
        button {
            flex: 1 1 0;
            background: white;
            border: none;
            padding: 14px 20px;
            font-weight: 600;
            font-size: 1.1rem;
            border-radius: 60px;
            cursor: pointer;
            background: #1e2b3c;
            color: white;
            box-shadow: 0 8px 18px rgba(0,30,60,0.2);
            transition: 0.15s;
            border: 1px solid rgba(255,255,255,0.2);
            min-width: 130px;
        }
        button#resetBtn {
            background: #f0f4fa;
            color: #1e2b3c;
            box-shadow: 0 5px 10px rgba(0,0,0,0.05);
            border: 1px solid #cbd5e1;
        }
        button#resetBtn:hover {
            background: #e3e9f2;
        }
        button:hover {
            background: #253649;
            transform: scale(1.02);
        }
        button:disabled {
            opacity: 0.6;
            filter: grayscale(30%);
            pointer-events: none;
            background: #7f8c8d;
            box-shadow: none;
        }
        .error-message {
            color: #c0392b;
            font-size: 0.85rem;
            margin-top: 6px;
            margin-left: 18px;
            font-weight: 500;
            min-height: 22px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .success-message {
            color: #2e7d32;
            font-weight: 600;
            font-size: 1.2rem;
            text-align: center;
            background: #e8f5e9;
            padding: 14px 18px;
            border-radius: 60px;
            margin-top: 15px;
            border: 1px solid #a5d6a7;
            transition: all 0.3s;
        }
        .input-error {
            border-color: #c0392b !important;
            background-color: #fff8f7;
        }
        hr {
            border: none;
            border-top: 2px dashed #cbd5e1;
            margin: 20px 0 10px;
        }
        .note {
            font-size: 0.85rem;
            color: #4b5f73;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>✨ Event registration</h2>
    <div class="sub">Secure your spot — jQuery powered</div>

    <!-- registration form -->
    <form id="eventForm" novalidate>
        <!-- participant name -->
        <div class="form-group">
            <label for="fullName">👤 Participant name</label>
            <input type="text" id="fullName" placeholder="e.g. Alex Johnson" autocomplete="off">
            <div class="error-message" id="nameError"></div>
        </div>

        <!-- email -->
        <div class="form-group">
            <label for="email">📧 Email address</label>
            <input type="email" id="email" placeholder="name@example.com">
            <div class="error-message" id="emailError"></div>
        </div>

        <!-- event name (non‑editable) -->
        <div class="form-group">
            <label for="eventName">🎉 Event name (selected, not editable)</label>
            <input type="text" id="eventName" value="jQuery Conference 2025" readonly>
            <!-- readonly fields don't need error message, but we keep layout consistent -->
            <div class="error-message" id="eventError"></div>
        </div>

        <!-- mobile number -->
        <div class="form-group">
            <label for="mobile">📱 Mobile number (at least 10 digits)</label>
            <input type="tel" id="mobile" placeholder="9876543210">
            <div class="error-message" id="mobileError"></div>
        </div>

        <!-- submit + reset buttons -->
        <div class="button-group">
            <button type="button" id="submitBtn">📋 Register</button>
            <button type="button" id="resetBtn">⟲ Reset</button>
        </div>

        <!-- success / global message container -->
        <div id="globalMsg"></div>
        <hr>
        <div class="note">jQuery selectors, validation, css() & prop() in action</div>
    </form>
</div>

<script>
$(document).ready(function(){

    // ----- CACHE ELEMENTS USING jQuery SELECTORS (requirement) -----
    const $nameInput = $('#fullName');
    const $emailInput = $('#email');
    const $eventInput = $('#eventName');      // readonly, but selector used
    const $mobileInput = $('#mobile');
   
    const $submitBtn = $('#submitBtn');
    const $resetBtn = $('#resetBtn');
   
    const $nameError = $('#nameError');
    const $emailError = $('#emailError');
    const $eventError = $('#eventError');     // kept for completeness, though event is fixed
    const $mobileError = $('#mobileError');
    const $globalMsg = $('#globalMsg');

    // Helper function to reset borders & error messages (used by reset and before validation)
    function resetFieldStyles() {
        // Remove error border & red text from all input fields using css()
        $nameInput.css('border-color', '').removeClass('input-error');
        $emailInput.css('border-color', '').removeClass('input-error');
        $eventInput.css('border-color', '').removeClass('input-error');  // event field rarely invalid, but keep
        $mobileInput.css('border-color', '').removeClass('input-error');
       
        // Clear all error messages (set to empty string) and remove red color style
        $nameError.css('color', '').text('');
        $emailError.css('color', '').text('');
        $eventError.css('color', '').text('');
        $mobileError.css('color', '').text('');
       
        // Also remove any global success message
        $globalMsg.html('');
    }

    // ----- RESET BUTTON functionality (clear all, remove messages, enable submit) -----
    $resetBtn.on('click', function(){
        // Clear all text fields values (participant name, email, mobile)
        $nameInput.val('');
        $emailInput.val('');
        $mobileInput.val('');
        // Event name is readonly & preset, we don't change its value.
       
        // Remove any visual highlights, error messages, global message
        resetFieldStyles();
       
        // Ensure submit button is enabled and text is default
        $submitBtn.prop('disabled', false).text('📋 Register');
       
        // Also ensure no leftover border highlights (just in case)
        // Extra: if event field was accidentally highlighted, clean it
        $eventInput.css('border-color', '');
    });

    // ----- VALIDATION & SUBMIT logic -----
    $submitBtn.on('click', function(e){
        // Before anything, clear previous error styles & messages (but keep values)
        resetFieldStyles();

        // 1. Get values using jQuery .val() (requirement)
        const name = $nameInput.val().trim();
        const email = $emailInput.val().trim();
        const mobile = $mobileInput.val().trim();
        const eventName = $eventInput.val();   // not trimmed, but readonly anyway

        // Flag to track overall validity
        let isValid = true;

        // 2. Validate each field (not empty, email format, mobile digits & length)
       
        // --- Participant name ---
        if (name === '') {
            isValid = false;
            $nameError.text('❌ Participant name is required.').css('color', '#c0392b');
            $nameInput.css('border-color', '#c0392b').addClass('input-error');
        }

        // --- Email ---
        if (email === '') {
            isValid = false;
            $emailError.text('❌ Email address cannot be empty.').css('color', '#c0392b');
            $emailInput.css('border-color', '#c0392b').addClass('input-error');
        } else {
            // simple but robust email regex (standard requirement)
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                isValid = false;
                $emailError.text('❌ Enter a valid email (e.g., name@domain.com).').css('color', '#c0392b');
                $emailInput.css('border-color', '#c0392b').addClass('input-error');
            }
        }

        // --- Mobile number (digits only, minimum 10 digits) ---
        if (mobile === '') {
            isValid = false;
            $mobileError.text('❌ Mobile number is required.').css('color', '#c0392b');
            $mobileInput.css('border-color', '#c0392b').addClass('input-error');
        } else {
            // check if contains only digits (allow optional spaces/plus? but spec says digits, min 10 digits)
            // strict: only digits (0-9), at least 10 characters long.
            const digitsOnly = /^\d+$/.test(mobile);
            if (!digitsOnly) {
                isValid = false;
                $mobileError.text('❌ Mobile must contain only digits (0-9).').css('color', '#c0392b');
                $mobileInput.css('border-color', '#c0392b').addClass('input-error');
            } else if (mobile.length < 10) {
                isValid = false;
                $mobileError.text('❌ Mobile must have at least 10 digits.').css('color', '#c0392b');
                $mobileInput.css('border-color', '#c0392b').addClass('input-error');
            }
        }

        // (Event name is readonly, always filled, so no validation needed)

        // 3. If all fields valid -> success branch
        if (isValid) {
            // Display success message in green using css()
            $globalMsg.html(`✅ Registration Successful for ${name}`)
                      .css({
                          'color': '#2e7d32',
                          'font-weight': '600',
                          'font-size': '1.2rem',
                          'background': '#e8f5e9',
                          'padding': '14px 18px',
                          'border-radius': '60px',
                          'margin-top': '15px',
                          'border': '1px solid #a5d6a7'
                      });
           
            // Disable submit button using prop(), change its text to “Registered”
            $submitBtn.prop('disabled', true).text('✔ Registered');
           
            // (Optional) extra polish: remove any possible leftover errors
            // but resetFieldStyles already cleared them. We keep success clean.
        } else {
            // If invalid, optionally remove any previous global success message
            $globalMsg.html('');
        }
    });

    // Extra UX: When user starts typing in a field that had error, remove the red border? optional.
    // But it's not required. We'll keep core functionality.
    // Additionally, to meet "use jQuery selectors to access all form elements" we already did.
    // Also show that we used .css() extensively, and .prop() for disabled.

    // ensure reset also removes disabled status and sets correct text (already done)
    // But after success, reset button should bring back everything (done).
    // Edge: if reset after success, submit button re-enabled and text restored.

    // minor: if someone resets during invalid state, everything cleared properly.

    // Preemptive cleanup: set initial state (submit enabled)
    $submitBtn.prop('disabled', false).text('📋 Register');
});
</script>

<!-- additional comment to show jQuery selectors in action:
     we used: $('#fullName'), $('#email'), $('#eventName'), $('#mobile'),
     $('#submitBtn'), $('#resetBtn'), and error/id selectors.
     also $('form') but not necessary.
-->
</body>
</html>
